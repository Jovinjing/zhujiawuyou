server:
  port: 9090

ai:
  # TODO: 在生产环境中，请将apiKey替换为您的实际AI服务API密钥
  # apiKey: "YOUR_AI_API_KEY_HERE"
  apiKey: "${AI_API_KEY:YOUR_AI_API_KEY_HERE}"
# 数据库配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
#    ai
    username: ${DB_USERNAME:root}
#    10.96.187.151
    password: ${DB_PASSWORD:YOUR_DATABASE_PASSWORD}
#    url: jdbc:mysql://:3306/lzk?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
    url: ${DB_URL:jdbc:mysql://localhost:3306/lzk?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true}
  # 支持 swagger3
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 6000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB


# 配置mybatis实体和xml映射
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml

#fileBaseUrl: http://localhost:${server.port}
fileBaseUrl: ${FILE_BASE_URL:http://localhost:${server.port}}
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.common.controller
wx:
  # TODO: 在生产环境中，请将appid和secret替换为您的实际微信小程序AppID和AppSecret
  # appid: YOUR_WECHAT_APPID
  # secret: YOUR_WECHAT_APP_SECRET
  appid: ${WX_APPID:YOUR_WECHAT_APPID}
  secret: ${WX_SECRET:YOUR_WECHAT_APP_SECRET}